<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>md2pdf embedding demo</title>
<!-- No bundler: this import map resolves the renderer's npm dependencies from CDNs, at the versions in
     package-lock.json (npm test checks they match). highlight.js comes from its own ES build, because
     esm.sh's conversion of it exports nothing. Serve the repo root over HTTP (npm run demo) and open
     /demo/; browsers won't load modules from a file:// page. -->
<script type="importmap">
{
  "imports": {
    "markdown-it": "https://esm.sh/markdown-it@15.0.2",
    "markdown-it-anchor": "https://esm.sh/markdown-it-anchor@10.0.0",
    "markdown-it-emoji": "https://esm.sh/markdown-it-emoji@3.1.0",
    "markdown-it-footnote": "https://esm.sh/markdown-it-footnote@4.0.0",
    "markdown-it-task-lists": "https://esm.sh/markdown-it-task-lists@2.1.1",
    "highlight.js/lib/common": "https://cdn.jsdelivr.net/npm/@highlightjs/cdn-assets@11.12.0/es/highlight.min.js"
  }
}
</script>
<!-- Only the github style needs github-markdown-css under it; the page enables it with that style. -->
<link id="github-base" rel="stylesheet" href="https://cdn.jsdelivr.net/npm/github-markdown-css@5.9.0/github-markdown-light.css" disabled>
<link id="style" rel="stylesheet" href="../styles/classic.css">
<style>
  /* The host page's own look. None of it comes from md2pdf, and md2pdf's styles don't change it. */
  body {
    margin: 0;
    background: #eeece6;
    color: #2b2b2b;
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  header { background: #263238; color: #fff; padding: 14px 24px; }
  header h1 { margin: 0; font-size: 18px; font-weight: 600; }
  header p { margin: 2px 0 0; color: #b0bec5; font-size: 13px; }
  main {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr);
    gap: 20px;
    padding: 20px 24px;
  }
  /* Scoped to the page's own labels: task lists in the document render as <label>s too. */
  .source-label, .controls label { font-size: 13px; color: #555; }
  textarea {
    box-sizing: border-box;
    width: 100%;
    height: calc(100vh - 160px);
    min-height: 300px;
    padding: 12px;
    border: 1px solid #c9c6bc;
    border-radius: 6px;
    font: 13px/1.5 ui-monospace, Menlo, monospace;
    resize: vertical;
  }
  .controls { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; margin-bottom: 12px; }
  .controls label { display: flex; gap: 6px; align-items: center; }
  /* The document paints its own background, so give it room on this off-white page. */
  .markdown-body { padding: 32px 40px; border-radius: 6px; box-shadow: 0 1px 3px rgb(0 0 0 / 0.15); }
  @media (max-width: 800px) {
    main { grid-template-columns: minmax(0, 1fr); padding: 16px; }
    .markdown-body { padding: 20px; }
    textarea { height: 40vh; min-height: 200px; }
  }
</style>
</head>
<body>
<header>
  <h1>md2pdf embedding demo</h1>
  <p>This page has its own fonts and colors. The rendered document is styled by md2pdf alone.</p>
</header>
<main>
  <section>
    <label class="source-label" for="source">Markdown</label>
    <textarea id="source" spellcheck="false"># Quarterly notes

Rendered in the browser by **md2pdf**'s renderer, styled by one of its styles, inside a page that keeps its own look.

&gt; [!tip] Try the controls
&gt; Switch styles, or override the size, spacing and accent for this one document.

## What carries over from the CLI

- [x] Callouts, footnotes[^1] and emoji :sparkles:
- [x] Code highlighting
- [ ] Math (needs KaTeX passed in; this demo leaves it out)

| Style | Font | Feel |
|---|---|---|
| classic | serif | book |
| modern | sans | product docs |
| report | serif and sans | business |

```js
const md = createRenderer({ hljs, html: false });
article.innerHTML = md.render(markdown);
```

&gt; [!warning]
&gt; Raw HTML such as &lt;mark&gt;this highlight&lt;/mark&gt; passes through only when **Allow raw HTML** is on.

See [[#What carries over from the CLI]] for a wikilink to a heading.

[^1]: Footnotes collect at the end of the document.
</textarea>
  </section>
  <section>
    <div class="controls">
      <label>Style
        <select id="style-name">
          <option>github</option>
          <option selected>classic</option>
          <option>academic</option>
          <option>modern</option>
          <option>report</option>
          <option>resume</option>
          <option>worksheet</option>
        </select>
      </label>
      <label>Text size
        <select id="font-size">
          <option value="">style's own</option>
          <option>9pt</option>
          <option>12pt</option>
          <option>14pt</option>
        </select>
      </label>
      <label>Spacing
        <select id="space">
          <option value="0.75">compact</option>
          <option value="" selected>style's own</option>
          <option value="1.3">roomy</option>
        </select>
      </label>
      <label>Accent <input id="accent" type="color" value="#1f3a5f"></label>
      <label><input id="use-accent" type="checkbox"> override</label>
      <label><input id="raw-html" type="checkbox" checked> Allow raw HTML</label>
    </div>
    <article id="doc" class="markdown-body"></article>
  </section>
</main>
<script type="module">
  import hljs from 'highlight.js/lib/common';
  import { createRenderer } from '../lib/render.js';

  const $ = (id) => document.getElementById(id);
  const doc = $('doc');

  function render() {
    const md = createRenderer({ hljs, html: $('raw-html').checked });
    doc.innerHTML = md.render($('source').value);
  }

  function applyStyle() {
    const name = $('style-name').value;
    $('style').href = `../styles/${name}.css`;
    $('github-base').disabled = name !== 'github';
  }

  // The variables are set on this one article, so only this document changes.
  function setVariable(name, value) {
    if (value) doc.style.setProperty(name, value);
    else doc.style.removeProperty(name);
  }
  function applyVariables() {
    setVariable('--md2pdf-font-size', $('font-size').value);
    setVariable('--md2pdf-space', $('space').value);
    setVariable('--md2pdf-accent', $('use-accent').checked ? $('accent').value : '');
  }

  $('source').addEventListener('input', render);
  $('raw-html').addEventListener('change', render);
  $('style-name').addEventListener('change', applyStyle);
  for (const id of ['font-size', 'space', 'use-accent']) $(id).addEventListener('change', applyVariables);
  $('accent').addEventListener('input', () => { $('use-accent').checked = true; applyVariables(); });

  applyStyle();
  applyVariables();
  render();
</script>
</body>
</html>
